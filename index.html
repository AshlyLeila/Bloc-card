<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog card</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <img class="illustration" src="images/illustration-article.svg" alt="Illustrations d'un article de blog sur le HTML et le CSS">
        <div class="content">
            <p class="category">Learning</p>
            <p>Published 21 Dec 2023</p>
            <p class="title">HTML & CSS foundations</p>
            <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        <div class="icon-avatar">
            <img class="user-pic" src="images/image-avatar.webp" alt="avatar">
            <p>Greg Hooper</p>
        </div>
    </div>
</body>
</html>
